[project]
name = "python-runtime-installer"
version = "0.1.0"
description = "Build tooling and verification for an offline Windows Python runtime installer"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
authors = [{ name = "Alune" }]
dependencies = []

[dependency-groups]
dev = [
  "cyclonedx-bom==7.3.0",
  "jsonschema==4.26.0",
  "pip-audit==2.10.1",
  "pip-licenses==5.5.5",
  "pytest==9.1.1",
  "ruff==0.15.22",
]

[tool.uv]
package = false
required-version = "==0.11.29"

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
